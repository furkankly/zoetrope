# configuration for https://github.com/crate-ci/typos

[default]
extend-ignore-re = [
  # The truncation tests assert on deliberately cut strings: "hel…", "sessio…".
  # Anything ending in an ellipsis is a fragment on purpose.
  '"[^"\n]*…"',
  # A hyphenated prefix, not the word "mis" (e.g. "mis-dispatched").
  '\bmis-\w+',
]

[default.extend-words]
# The dictionary reads it as a misspelling of "ratatouille". It is the library
# rataflow, and so this crate, renders through.
ratatui = "ratatui"
# Playback jargon rather than a misspelling of "sought": the media event is
# itself named `seeked`, and a seeked-to frame is the frame a seek landed on.
seeked = "seeked"

[files]
# Real Codex captures: opaque call, response and thread ids are full of
# three-letter "words". Nothing in them is prose we wrote.
extend-exclude = ["assets/codex/**/*.jsonl"]
