name: CD

# release-plz cuts the GitHub release; this builds the binaries for it. The
# release is created with a PAT rather than the built-in GITHUB_TOKEN, which is
# what allows it to trigger this workflow at all.
on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  upload-assets:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false

    steps:
      # The release tag, not the branch: the binaries have to come from exactly
      # the commit that was published.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      # release-plz tags either `v1.2.3` or `zoetrope-v1.2.3` depending on how it
      # reads the workspace, so strip an optional package prefix as well as the v.
      - name: Get the version from the release tag
        shell: bash
        run: echo "RELEASE_VERSION=$(echo "$TAG" | sed -E 's/^(zoetrope-)?v//')" >> $GITHUB_ENV
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build the binary
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Prepare the archive
        shell: bash
        run: |
          # The crate is `zoetrope`; the command it installs is `zoe`.
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            bin="target/${{ matrix.target }}/release/zoe.exe"
          else
            bin="target/${{ matrix.target }}/release/zoe"
          fi

          archive="zoetrope-${{ env.RELEASE_VERSION }}-${{ matrix.target }}"
          echo "ARCHIVE=$archive" >> $GITHUB_ENV

          mkdir "$archive"
          cp "$bin" "$archive/"
          # CHANGELOG.md is in the tree because release-plz committed it.
          cp README.md LICENSE CHANGELOG.md "$archive/"

      - name: Import the GPG key
        if: runner.os != 'Windows'
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_RELEASE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Create the zip archive (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: 7z a "${{ env.ARCHIVE }}.zip" "${{ env.ARCHIVE }}"

      - name: Create the tarball and sign it (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar czf "${{ env.ARCHIVE }}.tar.gz" "${{ env.ARCHIVE }}"
          shasum -a 512 "${{ env.ARCHIVE }}.tar.gz" > "${{ env.ARCHIVE }}.tar.gz.sha512"
          gpg --detach-sign --armor "${{ env.ARCHIVE }}.tar.gz"

      - name: Attach the assets to the release
        uses: svenstaro/upload-release-action@v2
        with:
          file: zoetrope-${{ env.RELEASE_VERSION }}-${{ matrix.target }}*
          file_glob: true
          overwrite: true
          tag: ${{ github.event.release.tag_name }}
          repo_token: ${{ secrets.GH_TOKEN }}

  # The formula is rendered whole rather than bumped in place: it carries one
  # url + sha256 per platform, and the bump actions only understand a formula
  # with a single pair. Rendering also means the tap needs no formula seeded by
  # hand before the first release.
  update-homebrew-formula:
    name: Update the Homebrew formula
    needs: upload-assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tap
        uses: actions/checkout@v7
        with:
          repository: furkankly/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}

      - name: Render the formula
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # Matches the version parsing in the build job above.
          VERSION="$(echo "$TAG" | sed -E 's/^(zoetrope-)?v//')"
          base="https://github.com/furkankly/zoetrope/releases/download/${TAG}"

          # Four platforms means four checksums. The published assets are the
          # source of truth for them, so they are hashed as downloaded rather
          # than carried over from the build jobs.
          sha() {
            curl -fsSL "${base}/zoetrope-${VERSION}-$1.tar.gz" | sha256sum | cut -d' ' -f1
          }
          macos_arm=$(sha aarch64-apple-darwin)
          macos_intel=$(sha x86_64-apple-darwin)
          linux_arm=$(sha aarch64-unknown-linux-musl)
          linux_intel=$(sha x86_64-unknown-linux-musl)

          mkdir -p Formula
          cat > Formula/zoetrope.rb <<EOF
          class Zoetrope < Formula
            desc "Watch a Claude Code session as a live flow graph"
            homepage "https://github.com/furkankly/zoetrope"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "${base}/zoetrope-${VERSION}-aarch64-apple-darwin.tar.gz"
                sha256 "${macos_arm}"
              end
              on_intel do
                url "${base}/zoetrope-${VERSION}-x86_64-apple-darwin.tar.gz"
                sha256 "${macos_intel}"
              end
            end

            on_linux do
              on_arm do
                url "${base}/zoetrope-${VERSION}-aarch64-unknown-linux-musl.tar.gz"
                sha256 "${linux_arm}"
              end
              on_intel do
                url "${base}/zoetrope-${VERSION}-x86_64-unknown-linux-musl.tar.gz"
                sha256 "${linux_intel}"
              end
            end

            def install
              # The crate is \`zoetrope\`; the command you type is \`zoe\`.
              bin.install "zoe"
            end

            test do
              system "#{bin}/zoe", "--version"
            end
          end
          EOF

      - name: Commit and push
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/zoetrope.rb
          # A re-run of the same release renders an identical formula; committing
          # nothing is the correct outcome, not a failure.
          if git diff --quiet --cached; then
            echo "formula already up to date"
          else
            git commit -m "zoetrope ${VERSION}"
            git push
          fi
