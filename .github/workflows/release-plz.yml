name: Release

on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Publishes to crates.io, tags, and cuts the GitHub release. With
  # `release_always = false` in release-plz.toml this only acts on a merged
  # release PR; every other push to main is a no-op. The GitHub release it
  # creates is what triggers cd.yml to build the binaries.
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      # Trusted publishing: crates.io authenticates this workflow by its GitHub
      # OIDC identity and issues a credential that lives for the run, so no
      # long-lived registry token exists to store or rotate. Requires the crate
      # to be registered for trusted publishing on crates.io against this
      # repository and this workflow filename.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # git-cliff walks the whole history to build the changelog.
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  # Opens (and keeps updating) the PR that carries the version bump and the
  # changelog entry. Merging it is what triggers the job above.
  release-pr:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Never cancel in progress: a half-written release PR is worse than a slow
    # one, and these runs are cheap.
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          # A PAT rather than the default GITHUB_TOKEN: pull requests opened
          # with GITHUB_TOKEN do not trigger workflows, so the release PR would
          # sit there with no CI run on the very commit about to be published.
          # The same applies to the release cut by the job above, which has to
          # trigger cd.yml.
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      # The browser frontend is excluded from the workspace, so release-plz
      # never sees its lockfile — which still records the path dependency on
      # `zoetrope` at the previous version. CI's `cargo check --locked` refuses
      # a stale lockfile, so every release PR would fail its wasm check. Bring
      # the lockfile up to date on the release branch instead. release-plz
      # rewrites that branch on every push to main, which is fine: this step
      # runs again right after it does.
      - name: Sync the wasm frontend lockfile with the bumped version
        env:
          PR: ${{ steps.release-plz.outputs.pr }}
          # The same PAT: a push with the default token would not trigger CI on
          # the release PR either.
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          branch=$(jq -r '.head_branch // empty' <<<"${PR:-}")
          if [[ -z "$branch" ]]; then
            echo "no release PR this run; nothing to sync"
            exit 0
          fi
          git fetch origin "$branch"
          git checkout -B "$branch" FETCH_HEAD
          # Re-resolves only the path dependency; every registry entry stays
          # pinned exactly as it was.
          (cd web/wasm && cargo update -p zoetrope)
          if git diff --quiet -- web/wasm/Cargo.lock; then
            echo "wasm lockfile already matches; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(web): sync the wasm lockfile with the release version" -- web/wasm/Cargo.lock
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${branch}"
